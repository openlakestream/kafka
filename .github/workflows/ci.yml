name: CI

on:
  push:
    branches:
      - 'trunk'
      - '4.3-ursa'

  schedule:
    - cron: '0 0 * * 6,0'    # Run on Saturday and Sunday at midnight UTC

  pull_request:
    types: [ opened, synchronize, ready_for_review, reopened, labeled ]
    branches:
      - 'trunk'
      - '4.3-ursa'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Only auto-cancel in-progress runs when new commits are pushed (synchronize).
  # This avoids canceling runs triggered by non-code PR events like ready_for_review/reopened.
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') && github.event.action == 'synchronize' }}

permissions:
  contents: write

jobs:
  build:
    # Skip workflow if triggered by labeling but not with run-junit-tests label
    if: |
      github.event_name != 'pull_request' ||
      github.event.action != 'labeled' ||
      github.event.label.name == 'run-junit-tests'
    uses: ./.github/workflows/build.yml
    with:
      is-trunk: ${{ github.ref == 'refs/heads/trunk' }}
      is-public-fork: ${{ github.event.pull_request.head.repo.fork || false }}
      # Run JUnit tests for push events, scheduled runs, or PRs with 'run-junit-tests' label
      run-junit-tests: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'run-junit-tests') }}
    secrets:
      inherit
