# Pushing a tag `vX.Y.Z.W` builds the release tarball with version X.Y.Z.W and
# publishes two images for linux/amd64 and linux/arm64:
#   * lakestream/kafka:X.Y.Z.W (brokers, CLI and Ursa compactor)
#   * lakestream/kafka-strimzi:<strimzi>-kafka-X.Y.Z.W, the same distribution in
#     the Strimzi image layout for clusters managed by the Strimzi operator
#     (see docker/strimzi/README.md; Strimzi version defaults live in
#     docker/strimzi/build-image.sh)
# Each image is also pushed as `latest` (lakestream/kafka:latest and
# lakestream/kafka-strimzi:latest) unless the version carries a pre-release
# suffix such as `-rc1`, so `latest` always points at the most recent final
# release.
# Requires the DOCKER_USER and DOCKER_PASSWORD repository secrets.

name: Release Docker Image

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    if: github.repository == 'lakestream-io/kafka'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Gradle
        uses: ./.github/actions/setup-gradle
        with:
          java-version: 17
      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
      - name: Login to Docker Hub
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Resolve version and tags
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${VERSION#v}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          # Pre-release versions (e.g. 4.3.1.2-rc1) must not move `latest`.
          if [[ "${VERSION}" == *-* ]]; then
            echo "Pre-release ${VERSION}: not tagging latest"
            echo "KAFKA_LATEST_TAG_ARGS=" >> "$GITHUB_ENV"
            echo "STRIMZI_LATEST_TAG_ARGS=" >> "$GITHUB_ENV"
          else
            echo "KAFKA_LATEST_TAG_ARGS=--tag lakestream/kafka:latest" >> "$GITHUB_ENV"
            echo "STRIMZI_LATEST_TAG_ARGS=--tag lakestream/kafka-strimzi:latest" >> "$GITHUB_ENV"
          fi
      - name: Build and push
        run: |
          # shellcheck disable=SC2086  # intentionally word-split: empty or "--tag <name>"
          GRADLE_ARGS="-Pversion=${VERSION}" \
            docker/examples/docker-compose-files/cluster/ursa/build-image.sh \
            --push --platform linux/amd64,linux/arm64 \
            ${KAFKA_LATEST_TAG_ARGS} "lakestream/kafka:${VERSION}"
      - name: Build and push Strimzi image
        run: |
          # shellcheck disable=SC2086  # intentionally word-split: empty or "--tag <name>"
          docker/strimzi/build-image.sh \
            --tarball "core/build/distributions/kafka_2.13-${VERSION}.tgz" \
            --push --platform linux/amd64,linux/arm64 \
            ${STRIMZI_LATEST_TAG_ARGS}
