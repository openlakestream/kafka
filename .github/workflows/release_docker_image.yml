# Pushing a tag `vX.Y.Z.W` builds the release tarball with version X.Y.Z.W and
# publishes lakestream/kafka:X.Y.Z.W (brokers, CLI and Ursa compactor) for
# linux/amd64 and linux/arm64. Requires the DOCKER_USER and DOCKER_PASSWORD
# repository secrets.

name: Release Docker Image

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    if: github.repository == 'lakestream-io/kafka'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Gradle
        uses: ./.github/actions/setup-gradle
        with:
          java-version: 17
      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
      - name: Login to Docker Hub
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${VERSION#v}"
          GRADLE_ARGS="-Pversion=${VERSION}" \
            docker/examples/docker-compose-files/cluster/ursa/build-image.sh \
            --push --platform linux/amd64,linux/arm64 "lakestream/kafka:${VERSION}"
