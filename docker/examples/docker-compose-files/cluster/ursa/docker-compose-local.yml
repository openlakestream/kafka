---
services:
  oxia:
    image: oxia/oxia:main
    hostname: oxia
    container_name: oxia
    ports:
      - 6648:6648
    entrypoint: ["/oxia/bin/oxia"]
    command: ["standalone", "--data-dir=/data", "--shards=8"]
    volumes:
      - oxia-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8080/metrics || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka-1:
    image: ${IMAGE:-kafka-diskless:latest}
    hostname: kafka-1
    container_name: kafka-1
    user: root
    ports:
      - 29092:9092
    depends_on:
      oxia:
        condition: service_healthy
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093'
      KAFKA_LISTENERS: 'PLAINTEXT://:19092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:19092,PLAINTEXT_HOST://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      CLUSTER_ID: '4L6g3nShT-eMCtK--X86sw'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      KAFKA_URSA_STORAGE_ENABLE: 'true'
      KAFKA_URSA_STORAGE_OXIA_SERVICE_URL: 'oxia:6648'
      KAFKA_URSA_STORAGE_BACKEND_TYPE: 'LOCAL'
      KAFKA_URSA_STORAGE_WRITE_BUFFER_FLUSH_INTERVAL_MS: '250'
      KAFKA_URSA_STORAGE_WRITE_BUFFER_SIZE: '16777216' # 16 MiB (default is 4 MiB)
      KAFKA_SOCKET_SERVER_ENABLE_REQUEST_PIPELINING: 'true'
      KAFKA_URSA_STORAGE_PATH: '/var/lib/kafka/ursa'
    volumes:
      - kafka-1-data:/var/lib/kafka/data
      - kafka-1-ursa:/var/lib/kafka/ursa

  kafka-2:
    image: ${IMAGE:-kafka-diskless:latest}
    hostname: kafka-2
    container_name: kafka-2
    user: root
    ports:
      - 39092:9092
    depends_on:
      oxia:
        condition: service_healthy
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093'
      KAFKA_LISTENERS: 'PLAINTEXT://:19092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:19092,PLAINTEXT_HOST://localhost:39092
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      CLUSTER_ID: '4L6g3nShT-eMCtK--X86sw'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      KAFKA_URSA_STORAGE_ENABLE: 'true'
      KAFKA_URSA_STORAGE_OXIA_SERVICE_URL: 'oxia:6648'
      KAFKA_URSA_STORAGE_BACKEND_TYPE: 'LOCAL'
      KAFKA_URSA_STORAGE_WRITE_BUFFER_FLUSH_INTERVAL_MS: '250'
      KAFKA_URSA_STORAGE_WRITE_BUFFER_SIZE: '16777216' # 16 MiB (default is 4 MiB)
      KAFKA_SOCKET_SERVER_ENABLE_REQUEST_PIPELINING: 'true'
      KAFKA_URSA_STORAGE_PATH: '/var/lib/kafka/ursa'
    volumes:
      - kafka-2-data:/var/lib/kafka/data
      - kafka-2-ursa:/var/lib/kafka/ursa

  kafka-3:
    image: ${IMAGE:-kafka-diskless:latest}
    hostname: kafka-3
    container_name: kafka-3
    user: root
    ports:
      - 49092:9092
    depends_on:
      oxia:
        condition: service_healthy
    environment:
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093'
      KAFKA_LISTENERS: 'PLAINTEXT://:19092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:19092,PLAINTEXT_HOST://localhost:49092
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      CLUSTER_ID: '4L6g3nShT-eMCtK--X86sw'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      KAFKA_URSA_STORAGE_ENABLE: 'true'
      KAFKA_URSA_STORAGE_OXIA_SERVICE_URL: 'oxia:6648'
      KAFKA_URSA_STORAGE_BACKEND_TYPE: 'LOCAL'
      KAFKA_URSA_STORAGE_WRITE_BUFFER_FLUSH_INTERVAL_MS: '250'
      KAFKA_URSA_STORAGE_WRITE_BUFFER_SIZE: '16777216' # 16 MiB (default is 4 MiB)
      KAFKA_SOCKET_SERVER_ENABLE_REQUEST_PIPELINING: 'true'
      KAFKA_URSA_STORAGE_PATH: '/var/lib/kafka/ursa'
    volumes:
      - kafka-3-data:/var/lib/kafka/data
      - kafka-3-ursa:/var/lib/kafka/ursa

volumes:
  oxia-data:
  kafka-1-data:
  kafka-1-ursa:
  kafka-2-data:
  kafka-2-ursa:
  kafka-3-data:
  kafka-3-ursa:
