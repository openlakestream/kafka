# Demo services for topic creation, producer, and consumer performance testing
# Usage: docker compose -f docker-compose.yml -f docker-compose.demo.yml up

services:
  # Wait for Kafka cluster to be ready
  kafka-ready:
    image: ${IMAGE:-kafka-diskless:latest}
    restart: "no"
    depends_on:
      - kafka-1
      - kafka-2
      - kafka-3
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        echo "Waiting for Kafka cluster to be ready..."
        until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:19092 --list 2>/dev/null; do
          echo "Kafka not ready yet, waiting..."
          sleep 5
        done
        echo "Kafka cluster is ready!"

  # Create diskless topic
  create-topic:
    image: ${IMAGE:-kafka-diskless:latest}
    restart: "no"
    depends_on:
      kafka-ready:
        condition: service_completed_successfully
    command: ["/opt/kafka/bin/kafka-topics.sh",
              "--bootstrap-server", "kafka-1:19092",
              "--create",
              "--if-not-exists",
              "--config", "ursa.storage.enable=true",
              "--topic", "test-diskless",
              "--partitions", "64"]

  # Producer performance test - instance 1
  producer-1: &producer-config
    image: ${IMAGE:-kafka-diskless:latest}
    restart: "no"
    depends_on:
      create-topic:
        condition: service_completed_successfully
    command: ["/opt/kafka/bin/kafka-producer-perf-test.sh",
              "--producer-props", "bootstrap.servers=kafka-1:19092", "batch.size=1000000", "linger.ms=100", "max.request.size=64000000",
              "--topic", "test-diskless",
              "--record-size", "1000",
              "--num-records", "5000000",
              "--throughput", "10000"]

  # Producer performance test - instance 2
  producer-2:
    <<: *producer-config

  # Consumer performance test
  consumer:
    image: ${IMAGE:-kafka-diskless:latest}
    restart: "no"
    depends_on:
      producer-1:
        condition: service_started
      producer-2:
        condition: service_started
    environment:
      KAFKA_HEAP_OPTS: "-Xmx1G"
    command: ["/opt/kafka/bin/kafka-consumer-perf-test.sh",
              "--bootstrap-server", "kafka-1:19092",
              "--topic", "test-diskless",
              "--messages", "10000000",
              "--reporting-interval", "5000",
              "--show-detailed-stats",
              "--timeout", "60000",
              "--fetch-size", "512000"]
