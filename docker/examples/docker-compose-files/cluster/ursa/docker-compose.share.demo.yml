# Demo services for a share consumer workflow using perf tools on a single-partition diskless topic.
# Usage: docker compose -f docker-compose.yml -f docker-compose.share.demo.yml up
#        docker compose -f docker-compose.yml -f docker-compose.share.demo.yml down -v --remove-orphans

services:
  # Wait for Kafka cluster to be ready.
  kafka-ready:
    image: ${IMAGE:-kafka-diskless:latest}
    restart: "no"
    depends_on:
      - kafka-1
      - kafka-2
      - kafka-3
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        echo "Waiting for Kafka cluster to be ready..."
        until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:19092 --list 2>/dev/null; do
          echo "Kafka not ready yet, waiting..."
          sleep 5
        done
        echo "Kafka cluster is ready!"

  # Create a single-partition diskless topic for share consumer behavior.
  create-share-topic:
    image: ${IMAGE:-kafka-diskless:latest}
    restart: "no"
    depends_on:
      kafka-ready:
        condition: service_completed_successfully
    command: ["/opt/kafka/bin/kafka-topics.sh",
              "--bootstrap-server", "kafka-1:19092",
              "--create",
              "--if-not-exists",
              "--config", "ursa.storage.enable=true",
              "--topic", "test-diskless-share-demo",
              "--partitions", "1"]

  # Set the share group reset behavior so the demo always starts from the beginning.
  configure-share-group:
    image: ${IMAGE:-kafka-diskless:latest}
    restart: "no"
    depends_on:
      create-share-topic:
        condition: service_completed_successfully
    command: ["/opt/kafka/bin/kafka-configs.sh",
              "--bootstrap-server", "kafka-1:19092",
              "--entity-type", "groups",
              "--entity-name", "test-diskless-share-demo-group",
              "--alter",
              "--add-config", "share.auto.offset.reset=earliest"]

  # Producer perf test for the share demo topic.
  share-producer:
    image: ${IMAGE:-kafka-diskless:latest}
    restart: "no"
    depends_on:
      configure-share-group:
        condition: service_completed_successfully
    command: ["/opt/kafka/bin/kafka-producer-perf-test.sh",
              "--producer-props", "bootstrap.servers=kafka-1:19092", "acks=1", "linger.ms=25", "batch.size=65536",
              "--topic", "test-diskless-share-demo",
              "--record-size", "256",
              "--num-records", "40000",
              "--throughput", "2000"]

  # Share consumer perf test with two share consumers in the same group.
  share-consumer:
    image: ${IMAGE:-kafka-diskless:latest}
    restart: "no"
    depends_on:
      share-producer:
        condition: service_started
    environment:
      KAFKA_HEAP_OPTS: "-Xmx1G"
    command: ["/opt/kafka/bin/kafka-share-consumer-perf-test.sh",
              "--bootstrap-server", "kafka-1:19092",
              "--topic", "test-diskless-share-demo",
              "--group", "test-diskless-share-demo-group",
              "--num-records", "40000",
              "--reporting-interval", "5000",
              "--show-detailed-stats",
              "--timeout", "30000",
              "--fetch-size", "262144",
              "--threads", "2",
              "--show-consumer-stats"]

  # Describe the share group after the producer has finished.
  describe-share-group:
    image: ${IMAGE:-kafka-diskless:latest}
    restart: "no"
    depends_on:
      share-consumer:
        condition: service_completed_successfully
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        echo "Waiting for share consumers to process records..."
        sleep 5
        for attempt in $(seq 1 5); do
          echo "Describe attempt ${attempt}..."
          /opt/kafka/bin/kafka-share-groups.sh \
            --bootstrap-server kafka-1:19092 \
            --describe \
            --group test-diskless-share-demo-group \
            --offsets && break
          sleep 3
        done
