# Demo overlay for `docker-compose-localstack-compaction.yml`.
# It creates a diskless topic, produces Avro (schema-registry) records to trigger parquet compaction,
# waits until parquet shows up in LocalStack S3, then consumes all messages back via Kafka.
#
# Usage (recommended):
#   # 1) start cluster
#   docker compose -f docker-compose-localstack-compaction.yml up -d
#   # 2) run demo workload and get an exit code
#   docker compose -f docker-compose-localstack-compaction.yml \
#     -f docker-compose-localstack-compaction.demo.yml \
#     run --rm avro-consumer
#   # 3) cleanup
#   docker compose -f docker-compose-localstack-compaction.yml down -v --remove-orphans

---
services:
  kafka-ready:
    image: ${IMAGE:-kafka-diskless:latest}
    restart: "no"
    depends_on:
      - kafka-1
      - kafka-2
      - kafka-3
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        echo "Waiting for Kafka cluster to be ready..."
        until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:19092 --list >/dev/null 2>&1; do
          echo "Kafka not ready yet, waiting..."
          sleep 5
        done
        if [[ -x /opt/kafka/bin/kafka-metadata-quorum.sh ]]; then
          echo "Waiting for KRaft controller quorum..."
          until /opt/kafka/bin/kafka-metadata-quorum.sh --bootstrap-server kafka-1:19092 describe --status >/dev/null 2>&1; do
            echo "Controller quorum not ready yet, waiting..."
            sleep 5
          done
        fi
        echo "Kafka cluster is ready!"

  create-topic:
    image: ${IMAGE:-kafka-diskless:latest}
    restart: "no"
    depends_on:
      kafka-ready:
        condition: service_completed_successfully
    entrypoint: ["/bin/bash", "-c"]
    environment:
      DEMO_TOPIC: ${DEMO_TOPIC:-}
    command:
      - |
        set -euo pipefail
        topic="$${DEMO_TOPIC:-test-diskless-schema}"
        bootstrap="kafka-1:19092,kafka-2:19092,kafka-3:19092"
        extra_timeout=()
        if /opt/kafka/bin/kafka-topics.sh --help 2>&1 | grep -q -- '--timeout-ms'; then
          extra_timeout+=(--timeout-ms 120000)
        fi
        echo "Creating topic: $$topic"
        for i in $(seq 1 60); do
          if /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server "$$bootstrap" \
            --create \
            --config ursa.storage.enable=true \
            --topic "$$topic" \
            --partitions 1 \
            --replication-factor 1 \
            "$${extra_timeout[@]}" >/dev/null 2>&1; then
            echo "Created topic: $$topic"
            exit 0
          fi
          echo "Topic creation not ready yet, retrying... ($$i/60)"
          sleep 5
        done
        echo "Failed to create topic after retries: $$topic" >&2
        exit 1

  avro-producer:
    image: ${AVRO_CLI_IMAGE:-confluentinc/cp-schema-registry:7.6.0}
    restart: "no"
    depends_on:
      create-topic:
        condition: service_completed_successfully
      schema-registry:
        condition: service_started
    entrypoint: ["/bin/bash", "-c"]
    environment:
      DEMO_TOPIC: ${DEMO_TOPIC:-}
      NUM_RECORDS: ${NUM_RECORDS:-}
      PAYLOAD_BYTES: ${PAYLOAD_BYTES:-}
      SCHEMA_REGISTRY_URL: ${SCHEMA_REGISTRY_URL:-}
    command:
      - |
        set -euo pipefail
        topic="$${DEMO_TOPIC:-test-diskless-schema}"
        num_records="$${NUM_RECORDS:-5000}"
        payload_bytes="$${PAYLOAD_BYTES:-1024}"
        schema_registry_url="$${SCHEMA_REGISTRY_URL:-http://schema-registry:8001}"

        # NOTE: `streamnative/schema-registry` currently returns 500 on `GET /subjects` in some builds,
        # so use `GET /schemas/types` for readiness.
        echo "Waiting for schema-registry at $$schema_registry_url ..."
        until curl -sf "$$schema_registry_url/schemas/types" >/dev/null; do
          sleep 2
        done

        schema='{"type":"record","name":"DemoRecord","fields":[{"name":"id","type":"int"},{"name":"payload","type":"string"}]}'
        payload="$$(head -c "$$payload_bytes" </dev/zero | tr '\0' 'x')"

        echo "Producing $$num_records Avro records to topic=$$topic payloadBytes=$$payload_bytes ..."
        seq 1 "$$num_records" | while read -r i; do
          printf '{"id":%s,"payload":"%s"}\n' "$$i" "$$payload"
        done | kafka-avro-console-producer \
          --bootstrap-server kafka-1:19092 \
          --topic "$$topic" \
          --property schema.registry.url="$$schema_registry_url" \
          --property value.schema="$$schema"

        echo "Producer finished."

  wait-for-parquet:
    image: amazon/aws-cli:latest
    restart: "no"
    depends_on:
      avro-producer:
        condition: service_completed_successfully
      localstack:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET:-}
      # Must match Kafka brokers/compactor S3 key prefix (`URSA_STORAGE_PATH`).
      URSA_STORAGE_PATH: ${URSA_STORAGE_PATH:-ursa}
      S3_PREFIX: ${S3_PREFIX:-}
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        echo "Waiting for parquet files to appear in LocalStack S3..."
        bucket="$${S3_BUCKET:-kafka-ursa}"
        prefix="$${S3_PREFIX:-$${URSA_STORAGE_PATH}}"
        for i in $(seq 1 180); do
          if [[ -n "$$prefix" ]]; then
            keys="$$(aws --endpoint-url=http://localstack:4566 s3api list-objects-v2 \
              --bucket "$$bucket" --prefix "$$prefix" --query 'Contents[].Key' --output text 2>/dev/null || true)"
          else
            keys="$$(aws --endpoint-url=http://localstack:4566 s3api list-objects-v2 \
              --bucket "$$bucket" --query 'Contents[].Key' --output text 2>/dev/null || true)"
          fi
          if echo "$$keys" | tr '\t' '\n' | grep -q '\.parquet$'; then
            echo "Parquet found."
            exit 0
          fi
          echo "No parquet yet, waiting... ($$i/180)"
          sleep 2
        done
        echo "Timed out waiting for parquet files in s3://$$bucket/$$prefix" >&2
        exit 1

  avro-consumer:
    image: ${AVRO_CLI_IMAGE:-confluentinc/cp-schema-registry:7.6.0}
    restart: "no"
    depends_on:
      wait-for-parquet:
        condition: service_completed_successfully
    entrypoint: ["/bin/bash", "-c"]
    environment:
      DEMO_TOPIC: ${DEMO_TOPIC:-}
      NUM_RECORDS: ${NUM_RECORDS:-}
      SCHEMA_REGISTRY_URL: ${SCHEMA_REGISTRY_URL:-}
    command:
      - |
        set -euo pipefail
        topic="$${DEMO_TOPIC:-test-diskless-schema}"
        num_records="$${NUM_RECORDS:-5000}"
        schema_registry_url="$${SCHEMA_REGISTRY_URL:-http://schema-registry:8001}"

        echo "Consuming $$num_records Avro records from topic=$$topic ..."
        out="/tmp/consumed.txt"
        kafka-avro-console-consumer \
          --bootstrap-server kafka-1:19092 \
          --topic "$$topic" \
          --from-beginning \
          --max-messages "$$num_records" \
          --property schema.registry.url="$$schema_registry_url" \
          > "$$out"

        count="$$(grep -c '\"payload\"' "$$out" || true)"
        echo "Consumed records: $$count"
        test "$$count" = "$$num_records"
        echo "OK: consumed all records."
