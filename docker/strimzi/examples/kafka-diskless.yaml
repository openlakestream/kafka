# Kafka cluster with Diskless/Ursa Storage managed by Strimzi (1.2.0 or later).
#
# Before applying:
#   * Replace <KAFKA_VERSION> in spec.kafka.image with the released version,
#     e.g. lakestream/kafka-strimzi:1.2.0-kafka-4.3.1.1. spec.kafka.version
#     stays a version Strimzi itself ships (4.3.1 for Strimzi 1.2.0); the
#     operator uses it to pick scripts and behaviour, the image is ours.
#   * Point the ursa.* settings at your Oxia service and S3-compatible bucket.
#   * Create the ursa-s3-credentials Secret referenced below, or drop it and
#     the access/secret key settings if the bucket is reached through the
#     SDK's default credentials chain.
#
# Brokers keep local disks for the KRaft metadata log and for classic topics
# such as __consumer_offsets; only topics created with ursa.storage.enable=true
# live in Ursa. Deploy the Ursa compactor alongside (ursa-compactor.yaml); without
# it retention frees no storage.
---
apiVersion: v1
kind: Secret
metadata:
  name: ursa-s3-credentials
type: Opaque
stringData:
  accessKey: minioadmin
  secretKey: minioadmin
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: controller
  labels:
    strimzi.io/cluster: diskless
spec:
  replicas: 3
  roles:
    - controller
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 10Gi
        deleteClaim: true
        kraftMetadata: shared
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: broker
  labels:
    strimzi.io/cluster: diskless
spec:
  replicas: 3
  roles:
    - broker
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 20Gi
        deleteClaim: true
        kraftMetadata: shared
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: diskless
spec:
  kafka:
    version: 4.3.1
    metadataVersion: 4.3-IV0
    image: lakestream/kafka-strimzi:1.2.0-kafka-<KAFKA_VERSION>
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
      - name: tls
        port: 9093
        type: internal
        tls: true
    config:
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      default.replication.factor: 3
      min.insync.replicas: 2
      # Resolve ${env:...} placeholders from the container environment.
      config.providers: env
      config.providers.env.class: org.apache.kafka.common.config.provider.EnvVarConfigProvider
      # Diskless storage: Oxia holds metadata and producer state, S3 holds data.
      ursa.storage.enable: true
      ursa.catalog.oxia.service.url: oxia://oxia.oxia.svc:6648/default
      ursa.oxia.service.url: oxia://oxia.oxia.svc:6648/default
      ursa.storage.backend.type: S3
      # For remote backends ursa.storage.path is the object prefix, not a local path.
      ursa.storage.path: ursa/wal
      ursa.storage.s3.endpoint: http://minio.minio.svc:9000
      ursa.storage.s3.access.key: ${env:URSA_S3_ACCESS_KEY}
      ursa.storage.s3.secret.key: ${env:URSA_S3_SECRET_KEY}
      ursa.storage.s3.bucket: kafka-ursa
      ursa.storage.s3.region: us-east-1
      ursa.storage.s3.path.style.access: true
      ursa.storage.compaction.bucket: kafka-ursa
      ursa.storage.compaction.prefix: ursa/compacted
    template:
      kafkaContainer:
        env:
          - name: URSA_S3_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: ursa-s3-credentials
                key: accessKey
          - name: URSA_S3_SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: ursa-s3-credentials
                key: secretKey
  entityOperator:
    topicOperator: {}
    userOperator: {}
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: diskless-events
  labels:
    strimzi.io/cluster: diskless
spec:
  partitions: 6
  # Ursa provides durability; Kafka-level replication is bypassed for diskless topics.
  replicas: 1
  config:
    ursa.storage.enable: "true"
    retention.ms: 604800000
